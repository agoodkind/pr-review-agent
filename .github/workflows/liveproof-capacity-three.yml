name: Live proof capacity three

on:
  pull_request_target:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release
