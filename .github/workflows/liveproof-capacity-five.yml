name: Live proof capacity five

on:
  pull_request_target:

permissions:
  id-token: write

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: ./.github/scripts/deploy.sh
