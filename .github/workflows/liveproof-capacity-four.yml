name: Live proof capacity four

on:
  pull_request_target:

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: ./scripts/publish.sh
