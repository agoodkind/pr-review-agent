name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-review-agent-release
  cancel-in-progress: false

jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      binary: pr-review-agent
    secrets: inherit

  container:
    name: Publish container
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/agoodkind/pr-review-agent
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release tag
        id: release
        run: |
          mapfile -t tags < <(git tag --points-at "${GITHUB_SHA}")
          if [ "${#tags[@]}" -ne 1 ]; then
            echo "release tag count = ${#tags[@]}, want 1" >&2
            exit 1
          fi
          release_tag=${tags[0]}
          if [[ ! "${release_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "release tag is not a valid container tag" >&2
            exit 1
          fi
          test "$(gh release view "${release_tag}" --json isDraft --jq .isDraft)" = "false"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
      - name: Download and verify canonical release assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir dist
          gh release download "${RELEASE_TAG}" --dir dist --pattern checksums.txt --pattern 'pr-review-agent_linux_*.tar.gz'
          cd dist
          expected_archives=(
            pr-review-agent_linux_amd64.tar.gz
            pr-review-agent_linux_arm64.tar.gz
          )
          shopt -s nullglob
          archives=(pr-review-agent_linux_*.tar.gz)
          if [ "${archives[*]}" != "${expected_archives[*]}" ]; then
            printf 'release assets = %s, want %s\n' "${archives[*]:-none}" "${expected_archives[*]}" >&2
            exit 1
          fi
          : > verified-checksums.txt
          for archive in "${expected_archives[@]}"; do
            match_count=0
            matched_checksum=
            while read -r checksum filename; do
              filename=${filename#\*}
              if [ "${filename}" = "${archive}" ]; then
                match_count=$((match_count + 1))
                matched_checksum=${checksum}
              fi
            done < checksums.txt
            if [ "${match_count}" -ne 1 ]; then
              echo "checksum entries for ${archive} = ${match_count}, want 1" >&2
              exit 1
            fi
            printf '%s  %s\n' "${matched_checksum}" "${archive}" >> verified-checksums.txt
          done
          sha256sum --check verified-checksums.txt
          for archive in "${archives[@]}"; do
            gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}"
            directory="${archive%.tar.gz}"
            mkdir "${directory}"
            tar -xzf "${archive}" -C "${directory}" pr-review-agent
          done
          version_output=$(pr-review-agent_linux_amd64/pr-review-agent --version)
          actual_version=${version_output#* }
          actual_version=${actual_version%% *}
          test "${actual_version}" = "${RELEASE_TAG}"
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish container
        id: image
        uses: docker/build-push-action@v7.3.0
        with:
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            VERSION=${{ steps.release.outputs.tag }}
          context: .
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Attest container
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Verify container manifest
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "${IMAGE}@${IMAGE_DIGEST}" > manifest.json
          docker buildx imagetools inspect --raw "${IMAGE}:${EXPECTED_VERSION}" > version-manifest.json
          cmp manifest.json version-manifest.json
          jq -e '[.manifests[].platform | select(.os != "unknown" and .architecture != "unknown") | (.os + "/" + .architecture)] | sort == ["linux/amd64", "linux/arm64"]' manifest.json
          for platform in linux/amd64 linux/arm64; do
            container_id=$(docker create --platform "${platform}" "${IMAGE}@${IMAGE_DIGEST}" --version)
            test "$(docker container inspect --format '{{.Config.User}}' "${container_id}")" = "65532:65532"
            test "$(docker container inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${container_id}")" = "${EXPECTED_VERSION}"
            version_output=$(docker start --attach "${container_id}")
            docker container rm "${container_id}"
            actual_version=${version_output#* }
            actual_version=${actual_version%% *}
            test "${actual_version}" = "${EXPECTED_VERSION}"
          done
          gh attestation verify "oci://${IMAGE}@${IMAGE_DIGEST}" --repo "${GITHUB_REPOSITORY}"
