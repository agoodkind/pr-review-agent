name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      binary: pr-review-agent
    secrets: inherit

  container:
    name: Publish container
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/agoodkind/pr-review-agent
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: release
        run: |
          mapfile -t tags < <(git tag --points-at "${GITHUB_SHA}")
          if [ "${#tags[@]}" -ne 1 ]; then
            echo "release tag count = ${#tags[@]}, want 1" >&2
            exit 1
          fi
          test "$(gh release view "${tags[0]}" --json isDraft --jq .isDraft)" = "false"
          echo "tag=${tags[0]}" >> "${GITHUB_OUTPUT}"
      - name: Download and verify canonical release assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir dist
          gh release download "${RELEASE_TAG}" --dir dist --pattern checksums.txt --pattern 'pr-review-agent_linux_*.tar.gz'
          cd dist
          sha256sum --check checksums.txt --ignore-missing
          for archive in pr-review-agent_linux_*.tar.gz; do
            gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}"
            directory="${archive%.tar.gz}"
            mkdir "${directory}"
            tar -xzf "${archive}" -C "${directory}" pr-review-agent
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish container
        id: image
        uses: docker/build-push-action@v6
        with:
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            VERSION=${{ steps.release.outputs.tag }}
          context: .
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Attest container
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Verify container manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "${IMAGE}@${IMAGE_DIGEST}" > manifest.json
          jq -e '[.manifests[].platform | (.os + "/" + .architecture)] | sort == ["linux/amd64", "linux/arm64"]' manifest.json
          gh attestation verify "oci://${IMAGE}@${IMAGE_DIGEST}" --repo "${GITHUB_REPOSITORY}"
