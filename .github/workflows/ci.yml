name: CI

# Run CI on every branch push, exactly once, with no duplication. There is no
# `pull_request` trigger: a same-repo PR would double-run (push + pull_request),
# and same-repo PRs already show these checks because GitHub matches checks to
# the head commit SHA. `'**'` matches branches but not tags, so the tag-driven
# release workflow is untouched. A repo that accepts fork PRs can add a
# fork-guarded `pull_request` trigger.
on:
  push:
    branches: ['**']

# Feature branch CI runs cancel superseded runs, and default branch CI runs are never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    # The reusable CI workflow runs the shared release build once per relevant
    # push (checkout, OIDC, and attestation), and secrets: inherit forwards the
    # signing material so that build is signed the same way a real release is.
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit

  container:
    name: Container
    needs: go
    if: needs.go.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build canonical Linux binary
        env:
          RELEASE_PLATFORMS: linux/amd64
          RELEASE_STAGE: compile
        run: make release
      - uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            VERSION=ci
          context: .
          load: true
          platforms: linux/amd64
          provenance: false
          tags: pr-review-agent:ci
      - name: Verify container
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' pr-review-agent:ci)" = "65532:65532"
          docker run --rm pr-review-agent:ci --version
          if docker run --rm --entrypoint /bin/sh pr-review-agent:ci; then
            exit 1
          fi
